<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio — AI Project Organiser</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white:        #fafaf8;
    --off-white:    #f2ede8;
    --paper:        #ede8e2;
    --burgundy:     #6b1a2a;
    --burgundy-mid: #8c2236;
    --burgundy-soft:#a8344a;
    --rule:         #ddd8d0;
    --rule-light:   #e8e3dc;
    --muted:        #9e9790;
    --text:         #3a3530;
    --text-light:   #6e6860;
  }

  body {
    background: var(--white);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  header {
    padding: 52px 60px 36px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .studio-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--burgundy-soft);
    margin-bottom: 10px;
  }

  .main-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 5vw, 60px);
    font-weight: 300;
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1;
  }

  .main-title em {
    font-style: italic;
    color: var(--burgundy);
  }

  .date-display {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    text-align: right;
  }

  /* Main layout */
  main {
    padding: 52px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Section label */
  .section-label {
    font-size: 8px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  /* Projects grid */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-bottom: 1px;
  }

  /* Project card */
  .project-card {
    background: var(--white);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  .project-card:hover {
    background: var(--off-white);
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--burgundy);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }

  .project-card:hover::before {
    transform: scaleX(1);
  }

  .card-header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--rule-light);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-index {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .card-meta {
    text-align: right;
  }

  .card-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    color: var(--burgundy);
    line-height: 1;
  }

  .card-count-label {
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  .card-body {
    padding: 20px 28px 28px;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.15;
  }

  .card-subtitle {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .card-tag {
    display: inline-block;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 12px;
    border: 1px solid var(--rule);
    color: var(--muted);
    margin-bottom: 20px;
  }

  .card-tag.primary {
    border-color: var(--burgundy-soft);
    color: var(--burgundy-soft);
  }

  .card-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 9px 18px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--burgundy);
    color: var(--white);
  }

  .btn-primary:hover {
    background: var(--burgundy-mid);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--rule);
  }

  .btn-ghost:hover {
    color: var(--text);
    border-color: var(--text-light);
  }

  .btn-outline {
    background: transparent;
    color: var(--burgundy);
    border: 1px solid var(--burgundy-soft);
  }

  .btn-outline:hover {
    background: var(--burgundy);
    color: var(--white);
  }

  /* Add new project card */
  .add-card {
    background: transparent;
    border: 1px dashed var(--rule);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    cursor: pointer;
    transition: all 0.3s ease;
    gap: 12px;
  }

  .add-card:hover {
    border-color: var(--burgundy-soft);
    background: rgba(107, 26, 42, 0.02);
  }

  .add-crosshair {
    width: 28px;
    height: 28px;
    position: relative;
    opacity: 0.25;
    transition: opacity 0.3s ease;
  }

  .add-crosshair::before,
  .add-crosshair::after {
    content: '';
    position: absolute;
    background: var(--text);
  }

  .add-crosshair::before {
    width: 1px;
    height: 100%;
    left: 50%;
    top: 0;
  }

  .add-crosshair::after {
    height: 1px;
    width: 100%;
    top: 50%;
    left: 0;
  }

  .add-card:hover .add-crosshair {
    opacity: 0.6;
  }

  .add-label {
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.3s ease;
  }

  .add-card:hover .add-label {
    color: var(--burgundy-soft);
  }

  /* Panel / drawer */
  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(240, 235, 228, 0.6);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    backdrop-filter: blur(6px);
  }

  .panel-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .panel {
    position: fixed;
    top: 0;
    right: -620px;
    width: min(580px, 100vw);
    height: 100vh;
    background: var(--white);
    border-left: 1px solid var(--rule);
    z-index: 101;
    transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel.open {
    right: 0;
  }

  .panel-header {
    padding: 36px 40px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-shrink: 0;
  }

  .panel-eyebrow {
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--burgundy-soft);
    margin-bottom: 6px;
  }

  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 300;
    color: var(--text);
    line-height: 1.1;
  }

  .panel-subtitle {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 5px;
  }

  .close-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .close-btn:hover {
    color: var(--text);
    border-color: var(--text-light);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }

  /* Entries list */
  .entries-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-bottom: 28px;
    background: var(--rule-light);
  }

  .entry-item {
    background: var(--white);
    padding: 20px 22px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    transition: background 0.2s;
    position: relative;
  }

  .entry-item:hover {
    background: var(--off-white);
  }

  .entry-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--burgundy-soft);
    flex-shrink: 0;
    line-height: 1.4;
    opacity: 0.6;
  }

  .entry-content {
    flex: 1;
    min-width: 0;
  }

  .entry-title {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--text);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .entry-body {
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .entry-meta {
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-top: 10px;
  }

  .entry-delete {
    background: none;
    border: none;
    color: var(--rule);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 4px;
    transition: color 0.2s;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .entry-delete:hover { color: var(--burgundy); }

  /* Add entry form */
  .add-entry-form {
    border: 1px solid var(--rule);
    padding: 28px;
    background: var(--off-white);
  }

  .form-label {
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--burgundy-soft);
    margin-bottom: 10px;
    display: block;
  }

  .form-input {
    width: 100%;
    background: var(--white);
    border: 1px solid var(--rule);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 300;
    padding: 12px 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
    line-height: 1.5;
  }

  .form-input:focus {
    border-color: var(--burgundy-soft);
  }

  .form-input::placeholder {
    color: var(--muted);
    font-weight: 300;
  }

  .form-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  /* Create project modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(240, 235, 228, 0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--white);
    border: 1px solid var(--rule);
    width: min(480px, 90vw);
    padding: 44px;
    position: relative;
    transform: translateY(16px);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 24px 60px rgba(60, 40, 40, 0.08);
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-eyebrow {
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--burgundy-soft);
    margin-bottom: 8px;
  }

  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 32px;
    line-height: 1.1;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }

  .empty-line {
    width: 1px;
    height: 40px;
    background: var(--rule);
    margin: 0 auto 16px;
  }

  .empty-state-text {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--white);
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 28px;
    z-index: 500;
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--rule-light);
    margin: 24px 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); }

  @media (max-width: 600px) {
    header, main { padding: 28px 24px; }
    .projects-grid { grid-template-columns: 1fr; }
    .panel-body, .panel-header { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="studio-name">AI Creative Studio</div>
    <h1 class="main-title">My <em>Projects</em></h1>
  </div>
  <div>
    <div class="date-display" id="dateDisplay"></div>
  </div>
</header>

<main>
  <div class="section-label">Active Projects</div>
  <div class="projects-grid" id="projectsGrid"></div>
</main>

<!-- Panel overlay -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<!-- Side panel -->
<div class="panel" id="panel">
  <div class="panel-header">
    <div>
      <div class="panel-eyebrow">Project</div>
      <div class="panel-title" id="panelTitle"></div>
      <div class="panel-subtitle" id="panelSubtitle"></div>
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="entries-list" id="entriesList"></div>

    <div class="add-entry-form">
      <label class="form-label">New Entry</label>
      <input type="text" class="form-input" id="entryTitle" placeholder="Title or label (optional)">
      <textarea class="form-input" id="entryBody" rows="4" placeholder="Paste your prompt, note, URL, or any content…"></textarea>
      <div class="form-row">
        <button class="btn btn-primary" onclick="addEntry()">Add Entry</button>
        <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
      </div>
    </div>
  </div>
</div>

<!-- Create project modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-eyebrow">New Project</div>
    <div class="modal-title">Create a sub-project</div>

    <label class="form-label">Project Name</label>
    <input type="text" class="form-input" id="newProjectName" placeholder="e.g. Very Good Girl — BTS">

    <label class="form-label">Description</label>
    <input type="text" class="form-input" id="newProjectDesc" placeholder="e.g. Behind the scenes notes">

    <label class="form-label">Category Tag</label>
    <input type="text" class="form-input" id="newProjectTag" placeholder="e.g. Runway / Midjourney / Prompts / Concepts">

    <div class="form-row" style="margin-top: 8px">
      <button class="btn btn-outline" onclick="createProject()">Create Project</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'caroline_studio_v2';

let state = {
  projects: [],
  entries: {}
};

const DEFAULT_PROJECTS = [
  { id: 'midjourney', name: 'Midjourney',            subtitle: 'Image Generation',        tag: 'Images',         primary: false },
  { id: 'runway',     name: 'Runway',                subtitle: 'Video Generation',         tag: 'Video',          primary: true  },
  { id: 'prompts',    name: 'Working Prompts',        subtitle: 'Prompts That Delivered',   tag: 'Prompts',        primary: false },
  { id: 'vgge',       name: 'Very Good Girl Elixir',  subtitle: 'Carolina Herrera Ad Film', tag: 'Active Project', primary: true  }
];

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    state = JSON.parse(saved);
  } else {
    state.projects = DEFAULT_PROJECTS.map(p => ({ ...p, created: new Date().toISOString() }));
    state.entries  = {};
    DEFAULT_PROJECTS.forEach(p => { state.entries[p.id] = []; });

    state.entries['prompts'] = [
      {
        id: uid(),
        title: 'Very Good Girl — Character Reference',
        body: '/imagine cinematic still, a strikingly sensual woman reclining on a black velvet chaise longue, deep crimson scarlet background, skintight black dress with iridescent deep red peacock feather embellishments and open back, long sleek straight black hair, foxy almond-shaped eyes, heavy black double eyeliner, full lips, subtle knowing smile, scattered red rose petals, black kittens with diamond choker collars at her feet, moody chiaroscuro lighting, luxury fashion editorial, 4K ultra detailed --ar 9:16 --style raw --v 6.1',
        date: new Date().toISOString()
      },
      {
        id: uid(),
        title: 'Credenza / Perfume Still Life',
        body: '/imagine onyx black marble credenza, white peonies with tiny ruby red centers, luxury perfume bottles crystal glass, soft candlelight, deep red background, scattered cherry blossom petals, editorial luxury still life --ar 16:9 --style raw',
        date: new Date().toISOString()
      }
    ];

    state.entries['vgge'] = [
      {
        id: uid(),
        title: 'Scene 1 — The Reveal',
        body: 'Runway prompt: A sensual woman in a black peacock feather dress reclines on a black velvet chaise longue. Deep crimson background. Red rose petals scattered everywhere. Small black kittens with diamond collars play around her. Slow cinematic dolly push-in toward her face. Moody dramatic lighting. Luxury perfume advertisement.',
        date: new Date().toISOString()
      },
      {
        id: uid(),
        title: 'Scene 7 — Have You Been a Good Girl?',
        body: "Runway prompt: Extreme close-up. The woman's eyes open slowly, dark and magnetic, staring directly into the camera. Her lips part into a slow deeply knowing smile — sensual, intelligent, amused. She holds the gaze. Does not blink. Deep crimson background. Soft focus bokeh. The final frame of a luxury perfume advertisement. Intimate. Unforgettable.",
        date: new Date().toISOString()
      }
    ];

    save();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid() {
  return Math.random().toString(36).substr(2, 9);
}

function renderDate() {
  const now = new Date();
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase();
}

function renderProjects() {
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = '';

  state.projects.forEach((project, idx) => {
    const entries = state.entries[project.id] || [];
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-index">0${idx + 1}</div>
        <div class="card-meta">
          <div class="card-count">${entries.length}</div>
          <div class="card-count-label">Entries</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${project.name}</div>
        <div class="card-subtitle">${project.subtitle}</div>
        <div class="card-tag${project.primary ? ' primary' : ''}">${project.tag}</div>
        <div class="card-actions">
          <button class="btn btn-primary" onclick="openPanel('${project.id}')">Open</button>
          <button class="btn btn-ghost" onclick="deleteProject(event, '${project.id}')">Delete</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.onclick = openModal;
  addCard.innerHTML = `
    <div class="add-crosshair"></div>
    <div class="add-label">New Sub-Project</div>
  `;
  grid.appendChild(addCard);
}

let currentProjectId = null;

function openPanel(projectId) {
  currentProjectId = projectId;
  const project = state.projects.find(p => p.id === projectId);
  document.getElementById('panelTitle').textContent = project.name;
  document.getElementById('panelSubtitle').textContent = project.subtitle;
  renderEntries(projectId);
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  currentProjectId = null;
  clearForm();
}

function renderEntries(projectId) {
  const list = document.getElementById('entriesList');
  const entries = state.entries[projectId] || [];

  if (entries.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-line"></div>
        <div class="empty-state-text">No entries yet</div>
      </div>
    `;
    return;
  }

  list.innerHTML = entries.map((entry, i) => `
    <div class="entry-item" id="entry-${entry.id}">
      <div class="entry-number">${String(i + 1).padStart(2, '0')}</div>
      <div class="entry-content">
        ${entry.title ? `<div class="entry-title">${entry.title}</div>` : ''}
        <div class="entry-body">${entry.body}</div>
        <div class="entry-meta">${formatDate(entry.date)}</div>
      </div>
      <button class="entry-delete" onclick="deleteEntry('${projectId}', '${entry.id}')">✕</button>
    </div>
  `).join('');
}

function addEntry() {
  if (!currentProjectId) return;
  const title = document.getElementById('entryTitle').value.trim();
  const body  = document.getElementById('entryBody').value.trim();
  if (!body) { showToast('Please add some content'); return; }

  if (!state.entries[currentProjectId]) state.entries[currentProjectId] = [];
  state.entries[currentProjectId].unshift({ id: uid(), title, body, date: new Date().toISOString() });
  save();
  renderEntries(currentProjectId);
  renderProjects();
  clearForm();
  showToast('Entry added');
}

function deleteEntry(projectId, entryId) {
  state.entries[projectId] = (state.entries[projectId] || []).filter(e => e.id !== entryId);
  save();
  renderEntries(projectId);
  renderProjects();
}

function clearForm() {
  document.getElementById('entryTitle').value = '';
  document.getElementById('entryBody').value = '';
}

function deleteProject(e, projectId) {
  e.stopPropagation();
  if (!confirm('Delete this project and all its entries?')) return;
  state.projects = state.projects.filter(p => p.id !== projectId);
  delete state.entries[projectId];
  save();
  renderProjects();
  showToast('Project deleted');
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('newProjectName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('newProjectName').value = '';
  document.getElementById('newProjectDesc').value = '';
  document.getElementById('newProjectTag').value  = '';
}

function createProject() {
  const name     = document.getElementById('newProjectName').value.trim();
  const subtitle = document.getElementById('newProjectDesc').value.trim() || 'Sub-project';
  const tag      = document.getElementById('newProjectTag').value.trim()  || 'Project';
  if (!name) { showToast('Please enter a project name'); return; }

  const id = uid();
  state.projects.push({ id, name, subtitle, tag, primary: false, created: new Date().toISOString() });
  state.entries[id] = [];
  save();
  renderProjects();
  closeModal();
  showToast('Project created');
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); closeModal(); }
  if (e.key === 'Enter' && e.metaKey && currentProjectId) addEntry();
});

load();
renderDate();
renderProjects();
</script>
</body>
</html>
